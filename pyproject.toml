[project]
name = "litrev"
version = "0.1.0"
description = "A local-first desktop workspace for literature reviews"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116",
    "networkx>=3.5",
    "platformdirs>=4.3",
    "pymupdf>=1.26",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
litrev = "litrev.__main__:main"
litrev-api = "litrev.__main__:serve"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
